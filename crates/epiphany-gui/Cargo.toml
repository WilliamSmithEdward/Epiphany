[package]
name = "epiphany-gui"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["compression-gzip"] }

[dev-dependencies]
epiphany-core = { path = "../epiphany-core" }
epiphany-server = { path = "../epiphany-server" }
tower = { version = "0.5.3", features = ["util"] }
