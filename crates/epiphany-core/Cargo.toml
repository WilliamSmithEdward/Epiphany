[package]
name = "epiphany-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
utoipa = { version = "6.0.0", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[features]
openapi = ["dep:utoipa"]
