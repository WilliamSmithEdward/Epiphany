[package]
name = "epiphany-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = "0.8.9"
blake2 = { version = "0.11.0", default-features = false }
epiphany-core = { path = "../epiphany-core", features = ["openapi"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
