<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epiphany lab</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 18%, Canvas); --shade: color-mix(in srgb, CanvasText 7%, Canvas); }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: Canvas; color: CanvasText; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 8px 4px 0; }
  label { display: grid; gap: 2px; font-size: 12px; opacity: .85; }
  select, button, input { font: inherit; }
  select, button { padding: 4px 8px; }
  #layout { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .zone { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 180px; min-height: 34px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; }
  .zone.over { border-color: Highlight; background: var(--shade); }
  .zone > b { font-size: 12px; opacity: .7; margin-right: 4px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--shade); cursor: grab; user-select: none; }
  .chip.dragging { opacity: .4; }
  .grip { width: 8px; height: 12px; opacity: .55; background: radial-gradient(circle, currentColor 1.1px, transparent 1.4px) 0 0 / 4px 4px; }
  .chip select { padding: 1px 4px; }
  .chip small { opacity: .65; }
  #mdx { padding: 10px 16px 12px; border-bottom: 1px solid var(--line); }
  #mdx .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  #mdx .bar label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  #query { width: 100%; box-sizing: border-box; font: 13px/1.45 ui-monospace, Consolas, monospace; padding: 8px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: Canvas; color: CanvasText; }
  #query.invalid { border-color: #c0392b; }
  #mdxStatus.error { color: #c0392b; }
  #signin { border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; background: Canvas; color: CanvasText; }
  #signin form { display: grid; gap: 12px; min-width: 260px; }
  #signin h2 { font-size: 16px; margin: 0; }
  #signin input { padding: 5px 8px; }
  #signinStatus { margin: 0; min-height: 1.2em; }
  #signinStatus.error { color: #c0392b; }
  #status { margin: 0; padding: 8px 16px; min-height: 1.4em; }
  #status.error { color: #c0392b; }
  #legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 0; padding: 0 16px 8px; font-size: 12px; opacity: .85; }
  #legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
  main { padding: 0 16px 24px; overflow: auto; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 0; white-space: nowrap; }
  th { padding: 4px 8px; text-align: left; font-weight: 600; background: var(--shade); }
  thead th { text-align: right; }
  td.total, td.problem { padding: 4px 8px; text-align: right; background: var(--shade); font-weight: 600; cursor: not-allowed; }
  td.problem { color: #c0392b; font-weight: 400; }
  td.leaf { background: color-mix(in srgb, Highlight 26%, Canvas); }
  td.leaf:hover { background: color-mix(in srgb, Highlight 40%, Canvas); }
  td.leaf.dirty, td.leaf.dirty:hover, td.spread.dirty { background: color-mix(in srgb, gold 60%, Canvas); }
  td.total.spread { padding: 0; cursor: cell; }
  td.total.spread input { font-weight: 600; }
  td input { width: 9em; border: 0; padding: 4px 8px; text-align: right; background: transparent; color: inherit; }
  td input.text { text-align: left; width: 16em; }
  td input:focus { outline: 2px solid Highlight; outline-offset: -2px; }
  td input[readonly] { cursor: cell; caret-color: transparent; }
  td input[readonly]::selection { background: transparent; }
  .toggle { all: unset; display: inline-block; width: 16px; text-align: center; cursor: pointer; opacity: .75; }
  .toggle:hover { opacity: 1; }
  .spacer { display: inline-block; width: 16px; }
  #menu { position: fixed; z-index: 10; display: grid; padding: 4px; background: Canvas; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / .35); }
  #menu button { all: unset; padding: 5px 14px; border-radius: 4px; cursor: pointer; }
  #menu button:hover { background: var(--shade); }
  #menu.panel { gap: 4px; padding: 10px 12px; max-width: 520px; font-size: 13px; }
  #menu.panel .where { font-weight: 600; margin-bottom: 4px; }
  #menu.panel code { font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 4px 6px; background: var(--shade); border-radius: 4px; }
  td.ruled { background: color-mix(in srgb, mediumpurple 32%, Canvas); }
  td.fed { background: color-mix(in srgb, mediumseagreen 32%, Canvas); }
  td.unfed { background: color-mix(in srgb, mediumpurple 32%, Canvas); box-shadow: inset 0 0 0 2px orange; }
</style>
</head>
<body>
<header>
  <h1>Epiphany lab</h1>
  <label>Cube <select id="cube"></select></label>
  <button id="refresh">Refresh</button>
  <button id="fill">Fill visible leaves</button>
  <label>Spread <select id="method" title="How a value typed into a consolidation is shared out among its leaves"><option>proportional</option><option>equal</option><option>repeat</option></select></label>
  <button id="expand">Expand all</button>
  <button id="collapse">Collapse all</button>
  <label>Transaction <output id="transaction">none</output></label>
  <button id="begin">Begin</button>
  <button id="commit">Commit</button>
  <button id="rollback">Roll back</button>
  <a href="/openapi.json" target="_blank">OpenAPI</a>
  <button id="signout" hidden>Sign out</button>
</header>
<dialog id="signin">
  <form>
    <h2>Sign in</h2>
    <label>Name <input id="who" autocomplete="username" required></label>
    <label>Password <input id="secret" type="password" autocomplete="current-password" required></label>
    <p id="signinStatus"></p>
    <button>Sign in</button>
  </form>
</dialog>
<section id="layout">
  <div class="zone" data-zone="columns" title="Dimensions across the top"><b>Columns</b></div>
  <div class="zone" data-zone="rows" title="Dimensions down the side"><b>Rows</b></div>
  <div class="zone" data-zone="filters" title="Dimensions narrowed to one element you choose"><b>Filters</b></div>
  <div class="zone" data-zone="unused" title="Dimensions left at their top element"><b>Unused</b></div>
</section>
<section id="mdx">
  <div class="bar">
    <b>MDX</b>
    <label>View <select id="view" title="Queries saved with the cube"></select></label>
    <label><input type="checkbox" id="pretty" checked> Pretty print</label>
    <button id="copy">Copy</button>
    <button id="run" title="Ctrl+Enter">Run</button>
    <span id="mdxStatus"></span>
  </div>
  <textarea id="query" rows="7" spellcheck="false"></textarea>
</section>
<p id="status"></p>
<p id="legend">
  <span><i style="background: color-mix(in srgb, Highlight 26%, Canvas)"></i>Leaf: type to write</span>
  <span><i style="background: color-mix(in srgb, gold 60%, Canvas)"></i>Edited: not yet entered, or not yet committed</span>
  <span><i style="background: var(--shade)"></i>Consolidation: added up</span>
  <span><i style="background: color-mix(in srgb, mediumpurple 32%, Canvas)"></i>Rule</span>
  <span><i style="background: color-mix(in srgb, mediumseagreen 32%, Canvas)"></i>Rule, fed</span>
  <span><i style="background: color-mix(in srgb, mediumpurple 32%, Canvas); box-shadow: inset 0 0 0 2px orange"></i>Rule, not fed: missing from totals</span>
  <span>Right-click a cell to see where its value comes from</span>
</p>
<main><table id="grid"></table></main>
<script>
// The grid always shows the answer to the MDX query in the box. Dragging a dimension, folding
// a hierarchy or choosing a filter rewrites the query; typing a query that the server accepts
// moves the dimensions, filters and folds to match it.

const $ = id => document.getElementById(id);
const make = (tag, properties = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), properties);
  node.append(...children);
  return node;
};
const options = (select, names, chosen) =>
  select.replaceChildren(...names.map(name => make('option', { textContent: name, selected: name === chosen })));
const say = (id, message, isError = false) => {
  $(id).textContent = message;
  $(id).className = isError ? 'error' : '';
};
const status = (message, isError) => say('status', message, isError);

let token = sessionStorage.getItem('epiphany-token'); // the session, if the server has users
let signingIn = null;      // the sign-in in progress, so that several requests share one

/** Shows who is signed in, by whether there is a session to sign out of. */
const showSession = () => { $('signout').hidden = !token; };

/** Asks for a name and password until the server accepts them. */
function signIn() {
  return signingIn ??= new Promise(resolve => {
    const dialog = $('signin');
    dialog.oncancel = event => event.preventDefault();
    dialog.querySelector('form').onsubmit = async event => {
      event.preventDefault();
      const credentials = { name: $('who').value, password: $('secret').value };
      const response = await fetch('/sessions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(credentials),
      });
      const answer = await response.json();
      $('secret').value = '';
      if (!response.ok) return say('signinStatus', answer.message, true);
      token = answer.token;
      sessionStorage.setItem('epiphany-token', token);
      say('signinStatus', '');
      dialog.close();
      signingIn = null;
      showSession();
      resolve();
    };
    dialog.showModal();
  });
}

async function api(method, path, body) {
  const headers = body ? { 'content-type': 'application/json' } : {};
  if (token) headers.authorization = `Bearer ${token}`;
  const response = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
  // The session has ended, or was never begun: sign in, then ask again.
  if (response.status === 401) {
    token = null;
    sessionStorage.removeItem('epiphany-token');
    showSession();
    await signIn();
    return api(method, path, body);
  }
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(data?.message ?? `${response.status} ${response.statusText}`);
  return data;
}

let model;                 // the model definition
const dimensions = {};     // dimension views by name, loaded on demand
let cube;                  // the chosen cube: its name and its dimensions' names
let layout;                // { columns, rows, filters, unused }: the cube's dimension names by zone
let slice = {};            // the chosen element of each dimension, used while it is a filter
let unfolded = {};         // per dimension, the names of the consolidations shown expanded
let transaction = null;    // the open transaction, which reads and writes then go through
const pending = new Set(); // the cells written in the open transaction, by cellKey
let shown = null;          // the query last answered: { text, result, sideways }
let visible = [];          // { at, editable, text } for every cell on screen

async function dimension(name) {
  return dimensions[name] ??= await api('GET', `/dimensions/${encodeURIComponent(name)}`);
}
const element = (name, member) => dimensions[name].elements.find(e => e.name === member);
/** The element a dimension stands at when a query does not mention it: its first top element. */
const topElement = name => dimensions[name].elements.find(e => !e.parents.length) ?? dimensions[name].elements[0];

// Transactions

function showTransaction() {
  $('transaction').textContent = transaction ?? 'none';
  $('begin').disabled = transaction !== null;
  $('commit').disabled = $('rollback').disabled = transaction === null;
}

async function begin() {
  try {
    transaction = (await api('POST', '/transactions')).transaction;
    status(`Began transaction ${transaction}. Its writes stay pending until you commit.`);
  } catch (error) {
    status(error.message, true);
  }
  showTransaction();
}

async function end(action, done) {
  try {
    await api('POST', `/transactions/${transaction}/${action}`);
    status(`${done} transaction ${transaction}.`);
  } catch (error) {
    status(error.message, true);
  }
  transaction = null;
  pending.clear();
  showTransaction();
  await rerun();
}

// The view: which dimensions are where, which element each filter is on, and what is folded

/** A dimension as a tree, parents before children, leaving out what is under a folded node. */
function nodes(name, all = false) {
  const found = [];
  const walk = (node, depth) => {
    const parent = node.children.length > 0;
    const open = parent && (all || unfolded[name].has(node.name));
    found.push({ element: node, depth, parent, open });
    if (open) for (const child of node.children) walk(element(name, child.name), depth + 1);
  };
  for (const node of dimensions[name].elements) if (!node.parents.length) walk(node, 0);
  return found;
}

/** The ways to fold a whole dimension, by the name shown to the user. */
const fold = {
  'Expand all': name => { unfolded[name] = new Set(dimensions[name].elements.filter(e => e.children.length).map(e => e.name)); },
  'Expand one level': name => {
    const closed = nodes(name).filter(node => node.parent && !node.open);
    const depth = Math.min(...closed.map(node => node.depth));
    for (const node of closed) if (node.depth === depth) unfolded[name].add(node.element.name);
  },
  'Collapse one level': name => {
    const opened = nodes(name).filter(node => node.open);
    const depth = Math.max(...opened.map(node => node.depth));
    for (const node of opened) if (node.depth === depth) unfolded[name].delete(node.element.name);
  },
  'Collapse all': name => { unfolded[name] = new Set(); },
};

async function chooseCube(name) {
  const definition = model.cubes.find(c => c.name === name);
  const views = await Promise.all(definition.dimensions.map(dimension));
  // The model may spell a dimension differently from the dimension itself; use its own name.
  cube = { name: definition.name, dimensions: views.map(view => view.name), views: definition.views ?? {} };
  for (const view of views) dimensions[view.name] = view;
  $('cube').value = cube.name;
  options($('view'), ['', ...Object.keys(cube.views)], '');
  slice = {};
  for (const name of cube.dimensions) {
    const elements = dimensions[name].elements;
    slice[name] = (elements.find(e => e.type !== 'consolidated') ?? elements[0]).name;
    fold['Expand all'](name);
  }
}

async function openCube() {
  await chooseCube($('cube').value);
  const [first, second, ...rest] = cube.dimensions;
  layout = { columns: second ? [second] : [], rows: [first], filters: rest, unused: [] };
  showLayout();
  await apply();
}

function chip(name, kind) {
  const node = make('span', { className: 'chip', draggable: true }, [make('span', { className: 'grip' }), name]);
  node.dataset.name = name;
  node.ondragstart = event => {
    event.dataTransfer.setData('text/plain', name);
    event.dataTransfer.effectAllowed = 'move';
    node.classList.add('dragging');
  };
  node.ondragend = () => node.classList.remove('dragging');
  if (kind === 'filters') {
    const select = make('select', { onchange: () => { slice[name] = select.value; apply(); } });
    const names = dimensions[name].elements.map(e => e.name);
    // A typed query may filter on a member that is not an element, such as a calculated one.
    options(select, names.includes(slice[name]) ? names : [slice[name], ...names], slice[name]);
    node.append(select);
  }
  if (kind === 'unused') node.append(make('small', { textContent: topElement(name).name }));
  if (kind === 'rows' || kind === 'columns') {
    node.title = 'Right-click to expand or collapse';
    node.oncontextmenu = event => showMenu(event, name);
  }
  return node;
}

function showLayout() {
  for (const zone of document.querySelectorAll('.zone')) {
    const kind = zone.dataset.zone;
    zone.replaceChildren(zone.firstElementChild, ...layout[kind].map(name => chip(name, kind)));
  }
}

function move(name, kind, before) {
  for (const names of Object.values(layout)) {
    const index = names.indexOf(name);
    if (index >= 0) names.splice(index, 1);
  }
  const index = before ? layout[kind].indexOf(before) : -1;
  layout[kind].splice(index < 0 ? layout[kind].length : index, 0, name);
  showLayout();
  apply(`Moved ${name} to ${kind}`);
}

for (const zone of document.querySelectorAll('.zone')) {
  zone.ondragover = event => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    zone.classList.add('over');
  };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = event => {
    event.preventDefault();
    zone.classList.remove('over');
    const name = event.dataTransfer.getData('text/plain');
    const before = event.target.closest('.chip')?.dataset.name;
    if (cube.dimensions.includes(name) && before !== name) move(name, zone.dataset.zone, before);
  };
}

const closeMenu = () => $('menu')?.remove();

/** Opens the menu of ways to fold a dimension, where its chip was right-clicked. */
function showMenu(event, name) {
  event.preventDefault();
  closeMenu();
  const choose = title => () => { closeMenu(); fold[title](name); apply(`${title} on ${name}`); };
  const items = Object.keys(fold).map(title => make('button', { textContent: title, onclick: choose(title) }));
  const menu = make('div', { id: 'menu' }, items);
  menu.style.left = `${event.clientX}px`;
  menu.style.top = `${event.clientY}px`;
  document.body.append(menu);
}

document.addEventListener('click', closeMenu);
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });

// MDX: written from the view, or typed and then read back into the view

const bracket = name => `[${name.replaceAll(']', ']]')}]`;
const unique = (name, member) => `${bracket(name)}.${bracket(member)}`;

/** The view as a query. MDX has no rows without columns, so rows alone go on the columns axis. */
function generate() {
  const axis = names => names
    .map(name => `{${nodes(name).map(node => unique(name, node.element.name)).join(', ')}}`)
    .join(' * ');
  const [columns, rows] = [axis(layout.columns), axis(layout.rows)];
  const axes = columns && rows ? [`${columns} ON COLUMNS`, `${rows} ON ROWS`]
    : columns || rows ? [`${columns || rows} ON COLUMNS`] : [];
  const where = layout.filters.map(name => unique(name, slice[name]));
  return `SELECT ${axes.join(', ')} FROM ${bracket(cube.name)}${where.length ? ` WHERE (${where.join(', ')})` : ''}`;
}

const KEYWORDS = ['SELECT', 'FROM', 'WHERE', 'WITH', 'MEMBER', 'SET', 'AS', 'ON', 'AND', 'OR', 'NOT', 'NON', 'EMPTY', 'DIMENSION', 'PROPERTIES'];
const TOKEN = /\[(?:[^\]]|\]\])*\]|"(?:[^"]|"")*"|'(?:[^']|'')*'|--[^\n]*|[A-Za-z_]\w*|\d+(?:\.\d+)?|<>|<=|>=|[(){},.+\-*\/=<>:]|\s+|./g;

/**
 * Lays a query out again: on one line, or pretty with a line for each clause, axis and
 * cross-joined set, and long lists wrapped. Text that cannot be split into tokens is returned
 * as it is.
 */
function format(text, pretty) {
  const tokens = (text.match(TOKEN) ?? []).filter(token => !/^\s+$/.test(token));
  if (tokens.some(token => token.length === 1 && !/[\w(){},.+\-*\/=<>:]/.test(token))) return text;
  const lines = [''];
  const write = token => { lines[lines.length - 1] += token; };
  const line = indent => { if (lines.at(-1).trim()) lines.push(' '.repeat(indent)); else lines[lines.length - 1] = ' '.repeat(indent); };
  let depth = 0;
  let previous = null;
  for (const token of tokens) {
    const word = /^[A-Za-z_]/.test(token) ? token.toUpperCase() : null;
    const keyword = KEYWORDS.includes(word);
    const top = depth === 0;
    if (pretty && top && ['SELECT', 'FROM', 'WHERE', 'WITH'].includes(word) && previous !== null) line(0);
    else if (pretty && top && ['MEMBER', 'SET'].includes(word)) line(2);
    else if (pretty && top && token === '*') line(4);
    else if (previous !== null && lines.at(-1).trim()) {
      const tight = '({.'.includes(previous) || ')},.'.includes(token)
        || (token === '(' && /^[\w\]]/.test(previous) && !KEYWORDS.includes(previous.toUpperCase()))
        || (previous === '-' && lines.at(-1).trimEnd().match(/[(,=<>+\-*\/]\s*-$|^\s*-$/));
      if (!tight) write(' ');
    }
    write(keyword ? word : token);
    if ('({'.includes(token)) depth += 1;
    if (')}'.includes(token)) depth -= 1;
    if (token.startsWith('--')) line(0);
    else if (pretty && word === 'SELECT' && top) line(2);
    else if (pretty && token === ',' && depth === 0) line(2);
    else if (pretty && token === ',' && lines.at(-1).length > 96) line(6);
    previous = token;
  }
  return lines.join('\n').trimEnd();
}

let runs = 0;              // counts queries sent, so a slow answer never replaces a newer one

/** Rewrites the query from the view, then runs it. */
async function apply(reason) {
  const text = format(generate(), $('pretty').checked);
  $('query').value = text;
  // Rows alone are sent on the columns axis but still drawn down the side.
  await run(text, { sideways: !layout.columns.length && layout.rows.length > 0, reason });
}

/** Runs the query last answered again, to show values that have changed. */
const rerun = reason => shown ? run(shown.text, { sideways: shown.sideways, reason }) : null;

/**
 * Sends a query. If the server answers, the grid shows the answer; a typed query also moves
 * the dimensions, filters and folds to match what it asked for.
 */
async function run(text, { sideways = false, typed = false, reason } = {}) {
  const turn = ++runs;
  let result;
  try {
    result = await api('POST', '/mdx', { transaction, mdx: text });
  } catch (error) {
    if (turn === runs) {
      $('query').classList.add('invalid');
      say('mdxStatus', error.message, true);
    }
    return;
  }
  if (turn !== runs) return;
  $('query').classList.remove('invalid');
  try {
    if (typed) await adopt(result);
    const facts = await explain(result, sideways);
    if (turn !== runs) return;
    shown = { text, result, sideways, facts };
    draw();
  } catch (error) {
    return status(`The grid could not be drawn: ${error.message}`, true);
  }
  const more = result.axes.length > 2 ? ' Only the first page of the further axes is shown.' : '';
  say('mdxStatus', `${result.cells.length.toLocaleString()} cells.${more}`);
  if (reason) status(`${reason}.`);
}

/** Moves the view to match the answer to a typed query. */
async function adopt(result) {
  if (result.cube !== cube.name) await chooseCube(result.cube);
  const on = axis => [...new Set((result.axes[axis]?.tuples[0] ?? []).map(member => member.dimension))];
  const [columns, rows] = [on(0), on(1)];
  const filters = result.slicer.map(member => member.dimension);
  for (const member of result.slicer) slice[member.dimension] = member.name;
  const placed = [...columns, ...rows, ...filters];
  layout = { columns, rows, filters, unused: cube.dimensions.filter(name => !placed.includes(name)) };
  // A consolidation is unfolded if the query shows anything beneath it, so that folding by
  // hand afterwards starts from a tree that still contains what the query showed.
  for (const name of [...columns, ...rows]) {
    const listed = new Set(result.axes.flatMap(axis => axis.tuples.flat()).filter(m => m.dimension === name).map(m => m.name));
    const covers = node => node.children.some(child => listed.has(child.name) || covers(element(name, child.name)));
    unfolded[name] = new Set(dimensions[name].elements.filter(covers).map(e => e.name));
  }
  showLayout();
}

// Grid

const cellKey = cell => [cell.cube ?? cube.name, ...cell.at].join('\n');

/** A row or column heading for a member, with a control to fold it if it has children. */
function heading(member, listed, indent) {
  const node = dimensions[member.dimension] && element(member.dimension, member.name);
  const parent = member.type === 'consolidated' && node?.children.length > 0;
  const open = parent && node.children.some(child => listed.has(`${member.dimension}\n${child.name}`));
  const toggle = parent
    ? make('button', {
        className: 'toggle',
        textContent: open ? '▾' : '▸',
        title: open ? 'Collapse' : 'Expand',
        onclick: () => { unfolded[member.dimension][open ? 'delete' : 'add'](member.name); apply(); },
      })
    : make('span', { className: 'spacer' });
  const cell = make('th', { title: `${member.unique_name} (${member.type})` }, [toggle, member.name]);
  if (indent) {
    const deepest = Math.max(...dimensions[member.dimension].elements.map(e => e.level));
    cell.style.paddingLeft = `${8 + 16 * (deepest - member.level)}px`;
  }
  return cell;
}

/** The tuples down the side and across the top of an answer, and the cell where each pair meets. */
function lay(result, sideways) {
  const columns = sideways ? [[]] : result.axes[0]?.tuples ?? [[]];
  const rows = sideways ? result.axes[0].tuples : result.axes[1]?.tuples ?? [[]];
  const sliced = Object.fromEntries(result.slicer.map(member => [member.dimension, member]));
  const fixed = name => sliced[name] ?? { name: topElement(name).name, type: topElement(name).type };
  const cells = rows.flatMap(row => columns.map(column => {
    const members = cube.dimensions.map(name => [...row, ...column].find(member => member.dimension === name) ?? fixed(name));
    // A member the query calculates is not an element, so the cell is not one the cube holds.
    return { at: members.map(member => member.name), held: members.every(member => member.type !== 'calculated') };
  }));
  return { columns, rows, cells };
}

/** Asks the server how each cell of an answer comes by its value. */
async function explain(result, sideways) {
  const { cells } = lay(result, sideways);
  const held = cells.filter(cell => cell.held);
  const asked = held.map(cell => ({ cube: cube.name, at: cell.at }));
  const answers = asked.length ? (await api('POST', '/cells/explain', { transaction, cells: asked })).cells : [];
  const facts = new Map(held.map((cell, index) => [cell, answers[index].cell ?? null]));
  return cells.map(cell => facts.get(cell) ?? null);
}

/** Draws the answer last received. */
function draw() {
  const { result, sideways, facts } = shown;
  const { columns, rows, cells } = lay(result, sideways);
  const listed = new Set([...columns, ...rows].flat().map(member => `${member.dimension}\n${member.name}`));
  visible = cells.map((cell, index) => {
    const fact = facts[index];
    const spreadable = fact?.kind === 'consolidated' && !fact.rule;
    return { at: cell.at, held: cell.held, fact, editable: fact?.writable ?? false, spreadable, text: fact?.kind === 'text' };
  });

  // The row dimension names sit above their labels, on the last header row only.
  // An axis may have no tuples at all, in which case its dimensions are not known.
  const [across, down] = [columns[0] ?? [], rows[0] ?? []];
  const depth = across.length;
  const corner = named => down.length ? down.map(member => make('th', { textContent: named ? member.dimension : '' })) : [make('th')];
  const head = depth
    ? across.map((_, k) => make('tr', {}, [...corner(k === depth - 1), ...columns.map(column => heading(column[k], listed, false))]))
    : [make('tr', {}, [...corner(true), make('th', { textContent: 'Value' })])];
  const body = rows.map((row, r) => {
    const labels = row.length ? row.map(member => heading(member, listed, true)) : [make('th', { textContent: 'Value' })];
    const cells = columns.map((_, c) => {
      const index = r * columns.length + c;
      return cellNode(visible[index], result.cells[index]);
    });
    return make('tr', {}, [...labels, ...cells]);
  });
  // Redrawing replaces every cell, so put the selection back where it was.
  const selected = document.activeElement?.dataset?.key;
  $('grid').replaceChildren(make('thead', {}, head), make('tbody', {}, body));
  if (selected) [...$('grid').querySelectorAll('input')].find(input => input.dataset.key === selected)?.focus();
}

function cellNode(cell, value) {
  const number = typeof value === 'number';
  const shownAs = number ? (value === 0 ? '' : value.toLocaleString(undefined, { maximumFractionDigits: 6 })) : value ?? '';
  const typed = number ? (value === 0 ? '' : String(value)) : value ?? '';
  const node = cell.editable ? leafNode(cell, typed, value => write([{ cube: cube.name, at: cell.at, value }]), 'leaf')
    : cell.spreadable ? leafNode(cell, typed, value => spread(cell, value), 'total spread')
    : make('td', { className: 'total', textContent: shownAs });
  const fact = cell.fact;
  if (!cell.editable) {
    // A rule's cell is shown apart from a plain total, and apart again by whether it is fed.
    // One that holds a value but is not fed is missing from the totals above it.
    const missed = fact?.rule && fact.fed === false && value !== 0;
    if (fact?.rule) node.classList.add(missed ? 'unfed' : fact.fed ? 'fed' : 'ruled');
    node.title = !cell.held ? 'Calculated by the query'
      : missed ? `Rule ${fact.rule.number}, but not fed: missing from totals`
      : fact?.rule ? `Rule ${fact.rule.number}${fact.fed ? ', fed' : ''}`
      : cell.spreadable ? 'Added up from its leaves. Type a value to spread it over them'
      : fact?.kind === 'consolidated' ? 'Added up from its leaves' : 'Read-only';
  }
  node.oncontextmenu = event => inspect(event, cell, shownAs);
  return node;
}

/** Opens a panel saying how a cell comes by its value, where the cell was right-clicked. */
async function inspect(event, cell, shownAs) {
  event.preventDefault();
  closeMenu();
  const line = (label, text) => make('div', {}, [make('b', { textContent: `${label} ` }), text]);
  const lines = [make('div', { className: 'where', textContent: `${cube.name}: ${cell.at.join(', ')}` })];
  const panel = make('div', { id: 'menu', className: 'panel' }, lines);
  panel.style.left = `${event.clientX}px`;
  panel.style.top = `${event.clientY}px`;
  document.body.append(panel);
  if (!cell.held) return panel.append(line('Value', shownAs), line('Source', 'calculated by the query; the cube holds no such cell'));
  let fact;
  try {
    const asked = { transaction, cells: [{ cube: cube.name, at: cell.at }], feeders: true };
    fact = (await api('POST', '/cells/explain', asked)).cells[0];
  } catch (error) {
    return panel.append(line('Error', error.message));
  }
  if (fact.error) return panel.append(line('Error', fact.error.message));
  fact = fact.cell;
  const kinds = { leaf: 'leaf', consolidated: 'consolidation', text: 'text' };
  const source = fact.rule ? `rule ${fact.rule.number}` : fact.kind === 'consolidated' ? 'added up from its leaves' : 'stored';
  panel.append(
    line('Value', String(fact.value === 0 ? '0' : fact.value)),
    line('Kind', kinds[fact.kind]),
    line('Source', source),
    line('Writable', fact.writable ? 'yes' : 'no'),
  );
  if (fact.rule) panel.append(make('code', { textContent: fact.rule.text }));
  if (fact.rule && fact.stored) panel.append(line('Stored', `${fact.stored} (hidden by the rule)`));
  if (fact.fed !== null) panel.append(line('Fed', fact.fed ? 'yes' : fact.rule ? 'no: missing from totals if it holds a value' : 'no'));
  for (const by of fact.fed_by) {
    panel.append(line(`Feeder ${by.feeder.number} of ${by.from.cube}`, `from ${by.from.at.join(', ')}`), make('code', { textContent: by.feeder.text }));
  }
  if (fact.fed === null && fact.kind === 'leaf' && fact.rule) panel.append(line('Fed', 'this cube has no feeders, so every cell is counted'));
}

/**
 * A leaf cell that behaves like a spreadsheet cell. Clicking selects it. Typing replaces its
 * value; F2 or a double click edits the value it has. Enter or leaving the cell enters the
 * change, Escape abandons it, Delete clears the cell, and the arrow keys move the selection.
 */
function leafNode(cell, original, send, className) {
  const key = cellKey(cell);
  const input = make('input', { value: original, readOnly: true, className: cell.text ? 'text' : '' });
  input.dataset.key = key;
  const node = make('td', { className }, [input]);
  const mark = () => node.classList.toggle('dirty', input.value !== original || pending.has(key));
  const edit = replace => {
    input.readOnly = false;
    if (replace) input.value = '';
    input.setSelectionRange(input.value.length, input.value.length);
  };
  const abandon = () => { input.value = original; input.readOnly = true; mark(); };
  const enter = () => {
    if (input.readOnly) return;
    const value = cell.text ? input.value : Number(input.value.replaceAll(',', '').trim() || 0);
    if (Number.isNaN(value)) {
      status(`"${input.value}" is not a number.`, true);
      return abandon();
    }
    input.readOnly = true;
    if (input.value !== original) send(value);
    mark();
  };
  mark();
  input.oninput = mark;
  input.onblur = enter;
  input.ondblclick = () => { if (input.readOnly) edit(false); };
  input.onkeydown = event => {
    const typed = event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey;
    if (!input.readOnly) {
      if (event.key === 'Enter') enter();
      if (event.key === 'Escape') abandon();
    } else if (event.key === 'F2') edit(false);
    else if (typed) edit(true);
    else if (event.key === 'Delete' && original !== '') send(cell.text ? '' : 0);
    else if (event.key in STEPS) {
      event.preventDefault();
      step(node, ...STEPS[event.key]);
    }
  };
  return node;
}

const STEPS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };

/** Moves the selection to the next leaf cell in a direction, passing over calculated cells. */
function step(from, down, right) {
  let row = from.parentElement;
  let index = from.cellIndex;
  for (;;) {
    if (down) row = down < 0 ? row.previousElementSibling : row.nextElementSibling;
    index += right;
    const next = row?.cells[index];
    if (!next || next.tagName === 'TH') return;
    const input = next.querySelector('input');
    if (input) return input.focus();
  }
}

/** Shares a value typed into a consolidation out among its leaves. */
async function spread(cell, value) {
  const method = $('method').value;
  try {
    const asked = { transaction, spread: { cube: cube.name, at: cell.at, value, method } };
    const { written } = await api('POST', '/cells/spread', asked);
    const where = transaction === null ? '' : ` in transaction ${transaction}, not yet committed`;
    status(`Spread ${value} over ${written} cell${written === 1 ? '' : 's'}, ${method}${where}.`);
  } catch (error) {
    status(error.message, true);
  }
  await rerun();
}

async function write(cells) {
  if (!cells.length) return status('No numeric leaf cells on screen: put the other dimensions in filters set to leaf elements.', true);
  try {
    await api('POST', '/cells/write', { transaction, cells });
    if (transaction !== null) cells.forEach(cell => pending.add(cellKey(cell)));
    const where = transaction === null ? '' : ` in transaction ${transaction}, not yet committed`;
    status(`Wrote ${cells.length} cell${cells.length === 1 ? '' : 's'}${where}.`);
  } catch (error) {
    status(error.message, true);
  }
  await rerun();
}

// Controls

let typing = null;         // the wait before a query being typed is tried
const tryTyped = () => { clearTimeout(typing); run($('query').value, { typed: true }); };

$('query').oninput = () => { clearTimeout(typing); typing = setTimeout(tryTyped, 700); };
$('query').onkeydown = event => { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); tryTyped(); } };
$('run').onclick = tryTyped;
$('view').onchange = () => {
  const saved = cube.views[$('view').value];
  if (!saved) return;
  $('query').value = format(saved.mdx, $('pretty').checked);
  tryTyped();
};
$('pretty').onchange = () => { $('query').value = format($('query').value, $('pretty').checked); };
$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('query').value);
    say('mdxStatus', 'Copied.');
  } catch (error) {
    $('query').select();
    say('mdxStatus', 'Could not reach the clipboard; the query is selected, so press Ctrl+C.', true);
  }
};
$('cube').onchange = openCube;
$('refresh').onclick = () => rerun('Refreshed');
$('expand').onclick = () => { [...layout.columns, ...layout.rows].forEach(fold['Expand all']); apply('Expanded every dimension'); };
$('collapse').onclick = () => { [...layout.columns, ...layout.rows].forEach(fold['Collapse all']); apply('Collapsed every dimension'); };
$('begin').onclick = begin;
$('commit').onclick = () => end('commit', 'Committed');
$('rollback').onclick = () => end('rollback', 'Rolled back');
$('fill').onclick = () => write(visible.filter(cell => cell.editable && !cell.text)
  .map(cell => ({ cube: cube.name, at: cell.at, value: Math.ceil(Math.random() * 1000) })));
$('signout').onclick = async () => {
  await fetch('/sessions', { method: 'DELETE', headers: { authorization: `Bearer ${token}` } });
  token = null;
  transaction = null;
  pending.clear();
  sessionStorage.removeItem('epiphany-token');
  showSession();
  showTransaction();
  await openCube();
};
showTransaction();
showSession();

(async () => {
  try {
    model = (await api('GET', '/model')).model;
    // Open on the first cube that holds numbers rather than text.
    const lasts = await Promise.all(model.cubes.map(c => dimension(c.dimensions.at(-1))));
    const numeric = model.cubes.find((_, index) => lasts[index].elements.some(e => e.type !== 'string'));
    options($('cube'), model.cubes.map(c => c.name), numeric?.name);
    await openCube();
    status('Ready. Drag dimensions between the zones, or type a query.');
  } catch (error) {
    status(error.message, true);
  }
})();
</script>
</body>
