<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epiphany lab</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 18%, Canvas); --shade: color-mix(in srgb, CanvasText 7%, Canvas); }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: Canvas; color: CanvasText; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 8px 4px 0; }
  label { display: grid; gap: 2px; font-size: 12px; opacity: .85; }
  select, button, input { font: inherit; }
  select, button { padding: 4px 8px; }
  #layout { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .zone { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 180px; min-height: 34px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; }
  .zone.over { border-color: Highlight; background: var(--shade); }
  .zone > b { font-size: 12px; opacity: .7; margin-right: 4px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--shade); cursor: grab; user-select: none; }
  .chip.dragging { opacity: .4; }
  .grip { width: 8px; height: 12px; opacity: .55; background: radial-gradient(circle, currentColor 1.1px, transparent 1.4px) 0 0 / 4px 4px; }
  .chip select { padding: 1px 4px; }
  .chip small { opacity: .65; }
  #status { margin: 0; padding: 8px 16px; min-height: 1.4em; }
  #status.error { color: #c0392b; }
  main { padding: 0 16px 24px; overflow: auto; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 0; white-space: nowrap; }
  th { padding: 4px 8px; text-align: left; font-weight: 600; background: var(--shade); }
  thead th { text-align: right; }
  td.total, td.problem { padding: 4px 8px; text-align: right; background: var(--shade); font-weight: 600; cursor: not-allowed; }
  td.leaf { background: color-mix(in srgb, Highlight 26%, Canvas); }
  td.leaf:hover { background: color-mix(in srgb, Highlight 40%, Canvas); }
  #legend { display: flex; gap: 16px; align-items: center; margin: 0; padding: 0 16px 8px; font-size: 12px; opacity: .85; }
  #legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
  td.problem { color: #c0392b; font-weight: 400; }
  .toggle { all: unset; display: inline-block; width: 16px; text-align: center; cursor: pointer; opacity: .75; }
  .toggle:hover { opacity: 1; }
  .spacer { display: inline-block; width: 16px; }
  .chip button { padding: 0 5px; font-size: 12px; line-height: 16px; }
  td input { width: 9em; border: 0; padding: 4px 8px; text-align: right; background: transparent; color: inherit; }
  td input.text { text-align: left; width: 16em; }
  td input:focus { outline: 2px solid Highlight; outline-offset: -2px; }
</style>
</head>
<body>
<header>
  <h1>Epiphany lab</h1>
  <label>Cube <select id="cube"></select></label>
  <button id="refresh">Refresh</button>
  <button id="fill">Fill visible leaves</button>
  <button id="expand">Expand all</button>
  <button id="collapse">Collapse all</button>
  <label>Transaction <output id="transaction">none</output></label>
  <button id="begin">Begin</button>
  <button id="commit">Commit</button>
  <button id="rollback">Roll back</button>
  <a href="/openapi.json" target="_blank">OpenAPI</a>
</header>
<section id="layout">
  <div class="zone" data-zone="columns" title="Dimensions across the top"><b>Columns</b></div>
  <div class="zone" data-zone="rows" title="Dimensions down the side"><b>Rows</b></div>
  <div class="zone" data-zone="filters" title="Dimensions narrowed to one element you choose"><b>Filters</b></div>
  <div class="zone" data-zone="unused" title="Dimensions left at their top element"><b>Unused</b></div>
</section>
<p id="status"></p>
<p id="legend">
  <span><i style="background: color-mix(in srgb, Highlight 26%, Canvas)"></i>Leaf: type to write</span>
  <span><i style="background: var(--shade)"></i>Consolidation: calculated, read-only</span>
</p>
<main><table id="grid"></table></main>
<script>
const MOST_CELLS = 20000;
const $ = id => document.getElementById(id);
const make = (tag, properties = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), properties);
  node.append(...children);
  return node;
};
const options = (select, names, chosen) =>
  select.replaceChildren(...names.map(name => make('option', { textContent: name, selected: name === chosen })));
const status = (message, isError = false) => {
  $('status').textContent = message;
  $('status').className = isError ? 'error' : '';
};

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body && JSON.stringify(body),
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(data?.message ?? `${response.status} ${response.statusText}`);
  return data;
}

let model;                // the model definition
const dimensions = {};    // dimension views by name, loaded on demand
let cube;                 // the chosen cube definition
let layout;               // { columns, rows, filters, unused }: the cube's dimension names by zone
let slice = {};           // the chosen element of each dimension, used while it is a filter
let unfolded = {};          // per dimension, the paths of the consolidations shown expanded
let visible = [];         // { at, editable, text } for every cell on screen
let transaction = null;   // the open transaction, which reads and writes then go through

async function dimension(name) {
  return dimensions[name] ??= await api('GET', `/dimensions/${encodeURIComponent(name)}`);
}

// Transactions

function showTransaction() {
  $('transaction').textContent = transaction ?? 'none';
  $('begin').disabled = transaction !== null;
  $('commit').disabled = $('rollback').disabled = transaction === null;
}

async function begin() {
  try {
    transaction = (await api('POST', '/transactions')).transaction;
    status(`Began transaction ${transaction}. Its writes stay pending until you commit.`);
  } catch (error) {
    status(error.message, true);
  }
  showTransaction();
}

async function end(action, done) {
  try {
    await api('POST', `/transactions/${transaction}/${action}`);
    status(`${done} transaction ${transaction}.`);
  } catch (error) {
    status(error.message, true);
  }
  transaction = null;
  showTransaction();
  await render();
}

// Layout: which dimensions are on columns, on rows, filtered to one chosen element, or unused

/** The element an unused dimension stands at: its first element with no parent. */
const topElement = name => dimensions[name].elements.find(element => !element.parents.length) ?? dimensions[name].elements[0];

// Hierarchies: a dimension on rows or columns is shown as a tree that can be folded

/**
 * The dimension as a tree, parents before children: one node per path from a top element,
 * so an element with two parents appears under each. Children of a folded node are left
 * out unless `all` is set.
 */
function nodes(name, all = false) {
  const { elements } = dimensions[name];
  const byName = new Map(elements.map(element => [element.name, element]));
  const found = [];
  const walk = (element, key, depth) => {
    const parent = element.children.length > 0;
    const isOpen = parent && (all || unfolded[name].has(key));
    found.push({ element, key, depth, parent, open: isOpen });
    if (isOpen) for (const child of element.children) walk(byName.get(child.name), `${key}\n${child.name}`, depth + 1);
  };
  for (const element of elements) if (!element.parents.length) walk(element, element.name, 0);
  return found;
}

/** The ways to fold a whole dimension, by the name shown to the user. */
const fold = {
  'Expand all': name => { unfolded[name] = new Set(nodes(name, true).filter(node => node.parent).map(node => node.key)); },
  'Expand one level': name => {
    const closed = nodes(name).filter(node => node.parent && !node.open);
    const depth = Math.min(...closed.map(node => node.depth));
    for (const node of closed) if (node.depth === depth) unfolded[name].add(node.key);
  },
  'Collapse one level': name => {
    const opened = nodes(name).filter(node => node.open);
    const depth = Math.max(...opened.map(node => node.depth));
    for (const node of opened) if (node.depth === depth) unfolded[name].delete(node.key);
  },
  'Collapse all': name => { unfolded[name] = new Set(); },
};

/** A row or column heading for a node, with a control to fold it if it has children. */
function heading(name, node, indent) {
  const toggle = node.parent
    ? make('button', {
        className: 'toggle',
        textContent: node.open ? '▾' : '▸',
        title: node.open ? 'Collapse' : 'Expand',
        onclick: () => { unfolded[name][node.open ? 'delete' : 'add'](node.key); render(); },
      })
    : make('span', { className: 'spacer' });
  const cell = make('th', {}, [toggle, node.element.name]);
  if (indent) cell.style.paddingLeft = `${8 + 16 * node.depth}px`;
  return cell;
}

async function chooseCube() {
  cube = model.cubes.find(c => c.name === $('cube').value);
  await Promise.all(cube.dimensions.map(dimension));
  const [first, second, ...rest] = cube.dimensions;
  layout = { columns: second ? [second] : [], rows: [first], filters: rest, unused: [] };
  slice = {};
  for (const name of cube.dimensions) {
    const elements = dimensions[name].elements;
    slice[name] = (elements.find(element => element.type !== 'consolidated') ?? elements[0]).name;
    fold['Expand all'](name);
  }
  showLayout();
  await render();
}

function chip(name, kind) {
  const node = make('span', { className: 'chip', draggable: true }, [make('span', { className: 'grip' }), name]);
  node.dataset.name = name;
  node.ondragstart = event => {
    event.dataTransfer.setData('text/plain', name);
    event.dataTransfer.effectAllowed = 'move';
    node.classList.add('dragging');
  };
  node.ondragend = () => node.classList.remove('dragging');
  if (kind === 'filters') {
    const select = make('select', { onchange: () => { slice[name] = select.value; render(); } });
    options(select, dimensions[name].elements.map(element => element.name), slice[name]);
    node.append(select);
  }
  if (kind === 'unused') node.append(make('small', { textContent: topElement(name).name }));
  if (kind === 'rows' || kind === 'columns') {
    const symbols = { 'Expand all': '++', 'Expand one level': '+', 'Collapse one level': '−', 'Collapse all': '−−' };
    node.append(...Object.entries(symbols).map(([title, textContent]) =>
      make('button', { title, textContent, onclick: () => { fold[title](name); render(`${title} on ${name}`); } })));
  }
  return node;
}

function showLayout() {
  for (const zone of document.querySelectorAll('.zone')) {
    const kind = zone.dataset.zone;
    zone.replaceChildren(zone.firstElementChild, ...layout[kind].map(name => chip(name, kind)));
  }
}

function move(name, kind, before) {
  for (const names of Object.values(layout)) {
    const index = names.indexOf(name);
    if (index >= 0) names.splice(index, 1);
  }
  const index = before ? layout[kind].indexOf(before) : -1;
  layout[kind].splice(index < 0 ? layout[kind].length : index, 0, name);
  showLayout();
  render(`Moved ${name} to ${kind}`);
}

for (const zone of document.querySelectorAll('.zone')) {
  zone.ondragover = event => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    zone.classList.add('over');
  };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = event => {
    event.preventDefault();
    zone.classList.remove('over');
    const name = event.dataTransfer.getData('text/plain');
    const before = event.target.closest('.chip')?.dataset.name;
    if (cube.dimensions.includes(name) && before !== name) move(name, zone.dataset.zone, before);
  };
}

// Grid

/** Every combination of one shown node from each of the named dimensions. */
const tuples = names => names.reduce(
  (found, name) => found.flatMap(tuple => nodes(name).map(node => [...tuple, node])),
  [[]],
);

function isEditable(elements) {
  const text = elements.at(-1).type === 'string';
  return { text, editable: text || elements.every(element => element.type !== 'consolidated') };
}

let renders = 0;          // counts reads of the grid, so a slow answer never replaces a newer one

/** Reads every cell of the current layout from the server and redraws the grid. */
async function render(reason) {
  try {
    await draw(++renders, reason);
  } catch (error) {
    status(`The grid could not be redrawn: ${error.message}`, true);
  }
}

async function draw(turn, reason) {
  const [rows, columns] = [tuples(layout.rows), tuples(layout.columns)];
  if (rows.length * columns.length > MOST_CELLS) {
    $('grid').replaceChildren();
    return status(`That layout has ${(rows.length * columns.length).toLocaleString()} cells; move a dimension to the filters.`, true);
  }
  const pick = (name, row, column) =>
    row[layout.rows.indexOf(name)]?.element ?? column[layout.columns.indexOf(name)]?.element
      ?? (layout.unused.includes(name) ? topElement(name) : dimensions[name].elements.find(element => element.name === slice[name]));

  visible = rows.flatMap(row => columns.map(column => {
    const elements = cube.dimensions.map(name => pick(name, row, column));
    return { at: elements.map(element => element.name), ...isEditable(elements) };
  }));
  let results;
  try {
    const cells = visible.map(cell => ({ cube: cube.name, at: cell.at }));
    results = (await api('POST', '/cells/read', { transaction, cells })).cells;
  } catch (error) {
    return status(error.message, true);
  }
  if (turn !== renders) return;

  // The row dimension names sit above their labels, on the last header row only.
  const corner = named => layout.rows.length ? layout.rows.map(name => make('th', { textContent: named ? name : '' })) : [make('th')];
  const last = layout.columns.length - 1;
  const head = layout.columns.length
    ? layout.columns.map((_, k) => make('tr', {}, [...corner(k === last), ...columns.map(column => heading(layout.columns[k], column[k], false))]))
    : [make('tr', {}, [...corner(true), make('th', { textContent: 'Value' })])];
  const body = rows.map((row, r) => {
    const labels = row.map((node, k) => heading(layout.rows[k], node, true));
    const cells = columns.map((_, c) => cellNode(visible[r * columns.length + c], results[r * columns.length + c]));
    return make('tr', {}, [...(labels.length ? labels : [make('th', { textContent: 'Value' })]), ...cells]);
  });
  $('grid').replaceChildren(make('thead', {}, head), make('tbody', {}, body));
  if (typeof reason === 'string') status(`${reason}: read ${visible.length.toLocaleString()} cells.`);
}

function cellNode(cell, result) {
  if (result.error) return make('td', { className: 'problem', textContent: result.error.code, title: result.error.message });
  const shown = cell.text ? result.value : result.value === 0 ? '' : result.value.toLocaleString(undefined, { maximumFractionDigits: 6 });
  if (!cell.editable) return make('td', { className: 'total', textContent: shown, title: 'Consolidation: calculated from its leaves' });
  const input = make('input', { value: cell.text ? result.value : result.value || '', className: cell.text ? 'text' : '' });
  input.onkeydown = event => { if (event.key === 'Enter') input.blur(); };
  input.onchange = () => {
    const value = cell.text ? input.value : Number(input.value.replaceAll(',', '') || 0);
    write([{ cube: cube.name, at: cell.at, value }]);
  };
  return make('td', { className: 'leaf' }, [input]);
}

async function write(cells) {
  if (!cells.length) return status('No numeric leaf cells on screen: put the other dimensions in filters set to leaf elements.', true);
  try {
    await api('POST', '/cells/write', { transaction, cells });
    const where = transaction === null ? '' : ` in transaction ${transaction}, not yet committed`;
    status(`Wrote ${cells.length} cell${cells.length === 1 ? '' : 's'}${where}.`);
  } catch (error) {
    status(error.message, true);
  }
  await render();
}

$('cube').onchange = chooseCube;
$('refresh').onclick = () => render('Refreshed');
$('expand').onclick = () => { cube.dimensions.forEach(fold['Expand all']); render('Expanded every dimension'); };
$('collapse').onclick = () => { cube.dimensions.forEach(fold['Collapse all']); render('Collapsed every dimension'); };
$('begin').onclick = begin;
$('commit').onclick = () => end('commit', 'Committed');
$('rollback').onclick = () => end('rollback', 'Rolled back');
$('fill').onclick = () => write(visible.filter(cell => cell.editable && !cell.text)
  .map(cell => ({ cube: cube.name, at: cell.at, value: Math.ceil(Math.random() * 1000) })));
showTransaction();

(async () => {
  try {
    model = (await api('GET', '/model')).model;
    // Open on the first cube that holds numbers rather than text.
    const lasts = await Promise.all(model.cubes.map(c => dimension(c.dimensions.at(-1))));
    const numeric = model.cubes.find((_, index) => lasts[index].elements.some(element => element.type !== 'string'));
    options($('cube'), model.cubes.map(c => c.name), numeric?.name);
    await chooseCube();
    status('Ready. Drag dimensions between columns, rows, filters and unused.');
  } catch (error) {
    status(error.message, true);
  }
})();
</script>
</body>
</html>
