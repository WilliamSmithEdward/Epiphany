name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Excel adapter: built, then tested against a real server. Excel itself is not needed.
  adapter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build -p epiphany-server
      - run: dotnet test adapter/Epiphany.Excel.Tests
      # What a Windows user needs, kept with the run: the server and the add-in.
      - run: cargo build --release -p epiphany-server
      - run: dotnet build adapter/Epiphany.Excel -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epiphany-windows
          path: |
            target/release/epiphany-server.exe
            adapter/Epiphany.Excel/bin/Release/net472/publish/*.xll
          if-no-files-found: error
